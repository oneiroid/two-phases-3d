<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Petri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500&display=swap">
<link rel="stylesheet" href="petri.css">
</head>
<body>
<canvas id="c" tabindex="0" aria-label="A living culture: coloured lineages of a reaction-diffusion automaton spread, compete, mutate and exhaust their soil"></canvas>
<div id="tl" class="hud">
  <div class="name">Petri</div>
  <div class="phase"><span class="dot" id="dot"></span><span id="ph">seeding</span></div>
  <div id="cnt">&nbsp;</div>
  <canvas id="plot" width="340" height="80" aria-hidden="true"></canvas>
  <div class="key"><span class="k1">life</span><span class="k2">soil</span><span class="k3">lineages</span></div>
  <div id="ev">&nbsp;</div>
</div>
<div id="tr" class="hud">
  <div class="cap">gene map<span id="gsel">greed 50%</span></div>
  <canvas id="gmap" width="300" height="300" aria-label="Gene map: every living strain as a dot. Click to choose the strain you paint with"></canvas>
  <div class="ax"><span>lineage →</span><span>↑ frail</span></div>
</div>
<div id="bar" class="hud">
  <div class="grp" role="group" aria-label="Tool">
    <button id="tSeed" type="button" aria-pressed="true" title="Paint the selected strain (S)">seed</button>
    <button id="tWipe" type="button" aria-pressed="false" title="Erase life (W)">wipe</button>
    <button id="tPick" type="button" aria-pressed="false" title="Pick a strain from the dish (alt-click)">pick</button>
    <button id="tPan" type="button" aria-pressed="false" title="Move around (right drag, or two fingers)">move</button>
  </div>
  <div class="grp" role="group" aria-label="View">
    <button id="v0" type="button" aria-pressed="true" title="1">life</button>
    <button id="v1" type="button" aria-pressed="false" title="2">genes</button>
    <button id="v2" type="button" aria-pressed="false" title="3">land</button>
  </div>
  <div class="grp"><label for="spd">speed</label><input id="spd" type="range" min="1" max="24" step="1" value="8"><button id="pause" type="button" aria-pressed="false" title="P">pause</button></div>
  <div class="grp"><label for="mut">mutation</label><input id="mut" type="range" min="0" max="100" step="1" value="45"></div>
  <div class="grp">
    <button id="cat" type="button" title="Wipe random craters (C)">cataclysm</button>
    <button id="new" type="button" title="Start a new dish (N)">new dish</button>
  </div>
</div>
<div id="hint"><b>drag</b> to paint the strain chosen on the gene map · <b>right drag</b> or <b>two fingers</b> to move · <b>wheel</b> or <b>pinch</b> to zoom</div>
<div id="fail" hidden>This needs WebGL 2 with float render targets, and it could not start in this browser.</div>
<script>setTimeout(()=>{if(!window.__petri)document.getElementById('fail').hidden=false},6000);</script>
<script type="module" src="petri.js"></script>
</body>
</html>
